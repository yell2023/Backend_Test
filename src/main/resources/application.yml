spring:
  application:
    name: user
  config:
    import: classpath:application-secret.yml
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
  h2:
    console:
      enabled: true

jwt:
  secret-key: ${JWT_SECRET}